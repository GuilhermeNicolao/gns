{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">

    <h3 class="mb-4">Análise Reajuste Taxas Credenciados</h3>

    <!-- Seletor de Ano -->
    <div class="row mb-4">
        <div class="col-md-3">
            <label for="anoSelect" class="form-label">Selecione o ano</label>
            <select id="anoSelect" class="form-select">
                <option value="">-- Selecione --</option>
            </select>
        </div>
    </div>

    <!-- Gráficos -->
    <div class="row">
        <div class="col-md-12 mb-4">
            <canvas id="graficoTs"></canvas>
        </div>

        <div class="col-md-12 mb-4">
            <canvas id="graficoTi"></canvas>
        </div>

        <div class="col-md-12 mb-4">
            <canvas id="graficoContagem"></canvas>
        </div>
    </div>

</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    let chartTs = null;
    let chartTi = null;
    let chartContagem = null;


    document.addEventListener('DOMContentLoaded', function () {
        fetch('/analisetaxasCPL?anos=1')
            .then(res => res.json())
            .then(anos => {
                const select = document.getElementById('anoSelect');
                anos.forEach(ano => {
                    const opt = document.createElement('option');
                    opt.value = ano;
                    opt.textContent = ano;
                    select.appendChild(opt);
                });
            });
    });

    document.getElementById('anoSelect').addEventListener('change', function () {
        const ano = this.value;
        if (!ano) return;

        fetch(`/analisetaxasCPL?ano=${ano}`)
            .then(response => response.json())
            .then(data => {
                montarGraficos(data);
            })
            .catch(err => {
                console.error('Erro ao carregar dados:', err);
            });
    });

    function montarGraficos(data) {
        const meses = data.medias_taxas.map(item => item.mes);

        const tsOriginal = data.medias_taxas.map(item => item.ts);
        const tiOriginal = data.medias_taxas.map(item => item.ti);

        const tsReajustada = data.mediastaxas_reajustadas.map(item => item.ts_n);
        const tiReajustada = data.mediastaxas_reajustadas.map(item => item.ti_n);

        const contagem = data.contagem_por_mes.map(item => item.total);

        // Destroi gráficos anteriores
        if (chartTs) chartTs.destroy();
        if (chartTi) chartTi.destroy();
        if (chartContagem) chartContagem.destroy();

        // -----------------------------
        // Gráfico TS
        // -----------------------------
        chartTs = new Chart(document.getElementById('graficoTs'), {
            type: 'line',
            data: {
                labels: meses,
                datasets: [
                    {
                        label: 'Taxa Serviço (Original)',
                        data: tsOriginal,
                        borderColor: '#1f3c88',
                        backgroundColor: 'transparent',
                        tension: 0.3
                    },
                    {
                        label: 'Taxa Serviço (Reajustada)',
                        data: tsReajustada,
                        borderColor: '#6c757d',
                        backgroundColor: 'transparent',
                        borderDash: [5,5],
                        tension: 0.3
                    }
                ]
            },
            options: {
                plugins: {
                    title: {
                        display: true,
                        text: 'Média Taxa de Serviço — Original vs Reajustada'
                    }
                }
            }
        });

        // -----------------------------
        // Gráfico TI
        // -----------------------------
        chartTi = new Chart(document.getElementById('graficoTi'), {
            type: 'line',
            data: {
                labels: meses,
                datasets: [
                    {
                        label: 'Taxa Interconexão (Original)',
                        data: tiOriginal,
                        borderColor: '#1f3c88',
                        backgroundColor: 'transparent',
                        tension: 0.3
                    },
                    {
                        label: 'Taxa Interconexão (Reajustada)',
                        data: tiReajustada,
                        borderColor: '#6c757d',
                        backgroundColor: 'transparent',
                        borderDash: [5,5],
                        tension: 0.3
                    }
                ]
            },
            options: {
                plugins: {
                    title: {
                        display: true,
                        text: 'Média Taxa de Interconexão — Original vs Reajustada'
                    }
                }
            }
        });

        // -----------------------------
        // Gráfico Contagem
        // -----------------------------
        chartContagem = new Chart(document.getElementById('graficoContagem'), {
            type: 'bar',
            data: {
                labels: meses,
                datasets: [
                    {
                        label: 'Quantidade de Credenciados',
                        data: contagem,
                        backgroundColor: '#1f3c88'
                    }
                ]
            },
            options: {
                plugins: {
                    title: {
                        display: true,
                        text: 'Contagem de Credenciados por Mês'
                    }
                }
            }
        });


    }
</script>

{% endblock %}
