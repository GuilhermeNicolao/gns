{% extends "base.html" %}
{% block content %}

<link rel="stylesheet" href="https://cdn.datatables.net/2.1.3/css/dataTables.dataTables.min.css">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/2.1.3/js/dataTables.min.js"></script>

<style>
    /* Container da página */
    .card-container {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        margin-top: 20px;
    }

    /* Título */
    .page-title {
        font-size: 26px;
        font-weight: 600;
        color: #333;
        margin-bottom: 20px;
    }

    table.dataTable td, 
    table.dataTable th {
        border: 1px solid #dcdcdc !important;
    }

    /* DataTables customizado */
    table.dataTable thead th {
        background: #343a40 !important;
        color: white !important;
        font-weight: 600;
        text-align: center;
    }

    /* Linhas alternadas */
    table.dataTable tbody tr:nth-child(odd) {
        background-color: #f7f7f7 !important;
    }

    table.dataTable tbody tr:nth-child(even) {
        background-color: #b8b8b8 !important;
    }

    /* Hover */
    table.dataTable tbody tr:hover {
        background-color: #e2e2e2 !important;
    }

    /* Células */
    table.dataTable tbody td {
        padding: 10px;
        vertical-align: middle;
    }

    /* Badge de destaque (taxas diferentes) */
    .badge-red {
        background: #dc3545;
        color: white;
        padding: 4px 10px;
        border-radius: 8px;
        font-weight: bold;
    }

    /* Navegação */
    .pagination-nav {
        margin: 25px 0;
        display: flex;
        gap: 10px;
        align-items: center;
    }

    .pagination-nav a {
        padding: 6px 16px;
        background: #343a40;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
        transition: 0.2s;
    }

    .pagination-nav a:hover {
        background: #212529;
    }

    .pagination-nav a.disabled {
        opacity: 0.4;
        pointer-events: none;
    }


    .filtro-container {
        background: #f9fafb;
        padding: 15px 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }


    .filtro-container label {
        font-size: 13px;
        font-weight: 600;
        color: #333;
        display: block;
        margin-bottom: 4px;
    }

    /* Inputs e Select */
    .filtro-container select,
    .filtro-container input[type="date"] {
        background-color: #f9fafb;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 6px 10px;
        font-size: 14px;
        color: #333;
        min-width: 160px;
        transition: border-color 0.2s, box-shadow 0.2s;
    }


    /* Focus */
    .filtro-container select:focus,
    .filtro-container input[type="date"]:focus {
        outline: none;
        border-color: #333;
        background-color: #f1f7fc;
        box-shadow: 0 0 0 2px rgba(51, 51, 51, 0.1);
    }

        
    /* Botões */
    .filtro-container button {
        padding: 7px 14px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 4px;
        border: 1px solid #ccc;
        cursor: pointer;
        transition: background-color 0.2s, border-color 0.2s;
    }

    .btn {
        padding: 7px 14px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-weight: 600;
    }

    .btn-primary {
        background: #089877;
        color: #fff;
    }

    .btn-primary:hover {
        background: #077a60;
    }

    .btn-secondary {
        background: #f1f7fc;
        color: #333;
        border: 1px solid #ccc;
    }

    .btn-secondary:hover {
        background: #e3edf7;
    }

    /* Botão Filtrar */
    #btnFiltrar {
        background-color: #f1f7fc;
        color: #333;
    }

    #btnFiltrar:hover {
        background-color: #e6f0fa;
        border-color: #333;
    }

    /* Botão Limpar */
    #btnLimpar {
        background-color: #f9fafb;
        color: #333;
    }

    #btnLimpar:hover {
        background-color: #f0f2f5;
        border-color: #333;
    }
</style>

<div class="filtro-container">

    <label>IPCA Referência:</label>
    <select id="ipca_mes">
        <option value="">Selecione...</option>
    </select>

    <label>Data início:</label>
    <input type="date" id="data_inicio">

    <label>Data fim:</label>
    <input type="date" id="data_fim">

    <button id="btnFiltrar" class="btn btn-primary">Filtrar</button>
    <button id="btnLimpar" class="btn btn-secondary">Limpar</button>
</div>

<div class="container mt-4">
    <table id="tabelaCred" class="display" style="width:100%;">
        <thead class="table-dark">
            <tr>
                <th>Código</th>
                <th>Razão Social</th>
                <th>Nome Fantasia</th>
                <th>Cidade</th>
                <th>UF</th>
                <th>Produtos</th>
                <th>Taxa ADM</th>
                <th>Taxa ADM (Reajustada)</th>
                <th>Taxa Interconexão</th>
                <th>Taxa Interconexão (Reajustada)</th>
                <th>Data Cadastro</th>
                <th>Data Última Transação</th>
            </tr>
        </thead>
    </table>

</div>

<script>
document.addEventListener("DOMContentLoaded", async function () {

    // Carrega meses do IPCA do backend
    const resp = await fetch("/api/ipca_meses");
    const meses = await resp.json();

    let select = document.getElementById("ipca_mes");
    meses.forEach(m => {
        let opt = document.createElement("option");
        opt.value = `${m.ano}-${m.mes}`;
        opt.textContent = `${m.mes}/${m.ano} - ${m.pct}%`;
        select.appendChild(opt);
    });

    var tabela = $('#tabelaCred').DataTable({
        processing: true,
        serverSide: true,
        ajax: {
            url: "/api/credenciadosCPL",
            type: "POST",
            data: function (d) {
                d.data_inicio = $('#data_inicio').val();
                d.data_fim = $('#data_fim').val();
                d.ipca_ref = $('#ipca_mes').val();
            }
        },

        columnDefs: [
            { targets: [5, 6], orderable: true },
            { targets: "_all", className: "dt-body-center" }
        ]
    });

    // Botão Filtrar → recarrega tabela
    $('#btnFiltrar').on('click', function () {
        tabela.ajax.reload(null, false);
    });

    // Botão Limpar filtros
    $('#btnLimpar').on('click', function () {
        $('#data_inicio').val('');
        $('#data_fim').val('');
        tabela.ajax.reload(null, false);
    });

});
</script>


{% endblock %}
